<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Shipfront</title>
    <meta name="description" content="Request a quote for Shipfront fulfillment services.">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    
    <header role="banner">
        <nav role="navigation" aria-label="Main navigation">
            <a href="/" class="logo" aria-label="Shipfront home">
                <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M16 24 L16 48 L40 48 L40 24 L16 24 M16 24 L28 16 L52 16 L40 24 M40 48 L52 40 L52 16 M52 16 L40 24 M40 24 L40 48" stroke="#FF2D2D" stroke-width="1.5" fill="none"/>
                </svg>
                <span class="wordmark">SHIPFRONT</span>
            </a>
            <ul class="nav-links">
                <li><a href="/#why-shipfront">Why Shipfront</a></li>
                <li><a href="/contact/">Contact</a></li>
                <li><a href="/quote/" class="cta-button" aria-current="page">Get a Quote</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" role="main">
        <section class="quote-section">
            <h1>Get a Quote</h1>
            <p class="section-intro">Tell us about your business and we will get back to you.</p>
            
            <form class="quote-form" id="quoteForm" aria-label="Quote request form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" required aria-required="true">
                </div>
                
                <button type="submit" class="cta-button-large">Submit Request</button>
            </form>

            <div class="form-notice" id="formNotice" style="display: none;" role="alert">
                <p><strong>This preview does not send.</strong></p>
                <p>For quote requests, please email <a href="mailto:info@myshipfront.com">info@myshipfront.com</a></p>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Shipfront. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('quoteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('formNotice').style.display = 'block';
            document.getElementById('formNotice').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
    </script>
</body>
</html>
