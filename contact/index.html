<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/shipfront-the-crate/">
    <title>Contact | Shipfront</title>
    <meta name="description" content="Contact Shipfront at our Los Angeles warehouse location.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    
    <header role="banner">
        <nav role="navigation" aria-label="Main navigation">
            <a href="./" class="logo" aria-label="Shipfront home">
                <svg width="32" height="32" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <!-- Back face -->
                    <path d="M50 65 L90 45 L130 65 L130 105 L90 125 L50 105 Z" stroke="#FF2D2D" stroke-width="3" fill="none"/>
                    <!-- Front face -->
                    <path d="M30 75 L70 55 L110 75 L110 115 L70 135 L30 115 Z" stroke="#FF2D2D" stroke-width="3" fill="none"/>
                    <!-- Connecting edges -->
                    <line x1="50" y1="65" x2="30" y2="75" stroke="#FF2D2D" stroke-width="3"/>
                    <line x1="90" y1="45" x2="70" y2="55" stroke="#FF2D2D" stroke-width="3"/>
                    <line x1="130" y1="65" x2="110" y2="75" stroke="#FF2D2D" stroke-width="3"/>
                    <line x1="130" y1="105" x2="110" y2="115" stroke="#FF2D2D" stroke-width="3"/>
                    <line x1="90" y1="125" x2="70" y2="135" stroke="#FF2D2D" stroke-width="3"/>
                    <line x1="50" y1="105" x2="30" y2="115" stroke="#FF2D2D" stroke-width="3"/>
                </svg>
                <span class="wordmark">SHIPFRONT</span>
            </a>
            <ul class="nav-links">
                <li><a href="./#why-shipfront">Why Shipfront</a></li>
                <li><a href="contact/" aria-current="page">Contact</a></li>
                <li><a href="quote/" class="cta-button">Get a Quote</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" role="main">
        <section class="contact-section">
            <h1>Visit Us Today</h1>
            
            <div class="contact-grid">
                <div class="contact-block">
                    <h2>Location</h2>
                    <address>
                        Shipfront<br>
                        1933 S. Broadway<br>
                        Los Angeles, CA 90007
                    </address>
                </div>
                
                <div class="contact-block">
                    <h2>Hours</h2>
                    <dl class="hours-list">
                        <dt>Monday - Friday</dt>
                        <dd>9 am - 5 pm</dd>
                        <dt>Saturday - Sunday</dt>
                        <dd>Appointment only</dd>
                    </dl>
                </div>
                
                <div class="contact-block">
                    <h2>Email</h2>
                    <p><a href="mailto:info@myshipfront.com">info@myshipfront.com</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Shipfront. All rights reserved.</p>
    </footer>
</body>
</html>
