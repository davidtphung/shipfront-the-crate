<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Shipfront</title>
    <meta name="description" content="Contact Shipfront at our Los Angeles warehouse location.">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    
    <header role="banner">
        <nav role="navigation" aria-label="Main navigation">
            <a href="/" class="logo" aria-label="Shipfront home">
                <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M16 24 L16 48 L40 48 L40 24 L16 24 M16 24 L28 16 L52 16 L40 24 M40 48 L52 40 L52 16 M52 16 L40 24 M40 24 L40 48" stroke="#FF2D2D" stroke-width="1.5" fill="none"/>
                </svg>
                <span class="wordmark">SHIPFRONT</span>
            </a>
            <ul class="nav-links">
                <li><a href="/#why-shipfront">Why Shipfront</a></li>
                <li><a href="/contact/" aria-current="page">Contact</a></li>
                <li><a href="/quote/" class="cta-button">Get a Quote</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" role="main">
        <section class="contact-section">
            <h1>Visit Us Today</h1>
            
            <div class="contact-grid">
                <div class="contact-block">
                    <h2>Location</h2>
                    <address>
                        Shipfront<br>
                        1933 S. Broadway<br>
                        Los Angeles, CA 90007
                    </address>
                </div>
                
                <div class="contact-block">
                    <h2>Hours</h2>
                    <dl class="hours-list">
                        <dt>Monday - Friday</dt>
                        <dd>9 am - 5 pm</dd>
                        <dt>Saturday - Sunday</dt>
                        <dd>Appointment only</dd>
                    </dl>
                </div>
                
                <div class="contact-block">
                    <h2>Email</h2>
                    <p><a href="mailto:info@myshipfront.com">info@myshipfront.com</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Shipfront. All rights reserved.</p>
    </footer>
</body>
</html>
