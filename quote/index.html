<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/shipfront-the-crate/">
    <title>Get a Quote | Shipfront</title>
    <meta name="description" content="Request a quote for Shipfront fulfillment services.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    
    <header role="banner">
        <nav role="navigation" aria-label="Main navigation">
            <a href="./" class="logo" aria-label="Shipfront home">
                <svg class="mark" width="20" height="20" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M50 65 L90 45 L130 65 L130 105 L90 125 L50 105 Z" stroke="#FF2D2D" stroke-width="1.25" vector-effect="non-scaling-stroke" fill="none"/>
                    <path d="M30 75 L70 55 L110 75 L110 115 L70 135 L30 115 Z" stroke="#FF2D2D" stroke-width="1.25" vector-effect="non-scaling-stroke" fill="none"/>
                    <line x1="50" y1="65" x2="30" y2="75" stroke="#FF2D2D" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
                    <line x1="90" y1="45" x2="70" y2="55" stroke="#FF2D2D" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
                    <line x1="130" y1="65" x2="110" y2="75" stroke="#FF2D2D" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
                    <line x1="130" y1="105" x2="110" y2="115" stroke="#FF2D2D" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
                    <line x1="90" y1="125" x2="70" y2="135" stroke="#FF2D2D" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
                    <line x1="50" y1="105" x2="30" y2="115" stroke="#FF2D2D" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
                </svg>
                <span class="wordmark">SHIPFRONT</span>
            </a>
            <ul class="nav-links">
                <li><a href="./#why-shipfront">Why Shipfront</a></li>
                <li><a href="contact/">Contact</a></li>
                <li><a href="quote/" class="cta-button" aria-current="page">Get a Quote</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" role="main">
        <section class="quote-section">
            <p class="eyebrow"><span class="meta">Quote</span></p>
            <h1>Get a Quote</h1>
            <p class="section-intro">Tell us about your business and we will get back to you.</p>
            
            <form class="quote-form" id="quoteForm" aria-label="Quote request form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" required aria-required="true">
                </div>
                
                <button type="submit" class="cta-button-large">Submit Request</button>
            </form>

            <div class="form-notice" id="formNotice" style="display: none;" role="alert">
                <p><strong>This preview does not send.</strong></p>
                <p>For quote requests, please email <a href="mailto:info@myshipfront.com">info@myshipfront.com</a></p>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>Built by David T Phung</p>
    </footer>

    <script>
        const form = document.getElementById('quoteForm');
        const notice = document.getElementById('formNotice');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            notice.style.display = 'block';
            notice.style.opacity = '0';
            notice.style.transform = 'translateY(-8px)';
            
            requestAnimationFrame(() => {
                notice.style.transition = 'opacity 340ms cubic-bezier(0.25, 0.1, 0.25, 1), transform 340ms cubic-bezier(0.25, 0.1, 0.25, 1)';
                notice.style.opacity = '1';
                notice.style.transform = 'translateY(0)';
            });
            
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const scrollBehavior = prefersReducedMotion ? 'auto' : 'smooth';
            notice.scrollIntoView({ behavior: scrollBehavior, block: 'nearest' });
        });
    </script>
</body>
</html>
